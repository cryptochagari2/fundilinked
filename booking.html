<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Fundi - FundiLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
  <h1 class="text-2xl font-bold text-center text-blue-600 mb-8">Book a Fundi</h1>
  <form class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md" id="bookingForm">
    <label class="block mb-2">Your Name</label>
    <input type="text" name="name" required class="w-full mb-4 p-2 border rounded" />
    <label class="block mb-2">Location</label>
    <input type="text" name="location" required class="w-full mb-4 p-2 border rounded" />
    <label class="block mb-2">Service Needed</label>
    <select name="service" required class="w-full mb-4 p-2 border rounded">
      <option>Plumbing</option>
      <option>Electrical</option>
      <option>Construction</option>
      <option>Painting</option>
      <option>Cleaning</option>
    </select>
    <label class="block mb-2">Phone Number</label>
    <input type="tel" name="phone" required class="w-full mb-4 p-2 border rounded" />
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Submit Request</button>
  </form>
  <script src="script.js"></script>
</body>
</html>
